name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Format check
        run: ./gradlew ktlintCheck
      - name: Static analysis
        run: ./gradlew detekt
      - name: Lint
        run: ./gradlew lintDebug
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Compile instrumentation tests
        run: ./gradlew compileDebugAndroidTestKotlin
      - name: Serialization + migration tests
        run: ./gradlew :core:core-document:test :core:core-database:test
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/reports/lint-results-*.html

  instrumentation:
    name: Instrumentation (API 34)
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumentation tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          force-avd-creation: false
          script: |
            ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.penly.app.EditorWorkflowUiTest || true
            $ANDROID_HOME/platform-tools/adb logcat -d -v threadtime > logcat.txt || true
            exit 0
      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logcat
          path: logcat.txt
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumentation-reports
          path: |
            **/build/reports/androidTests/**
            **/build/outputs/androidTest-results/**

  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: penly-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14