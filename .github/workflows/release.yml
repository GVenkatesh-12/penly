name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Full test matrix
        run: ./gradlew check

  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Decode keystore
        run: echo "${{ secrets.PENLY_KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/penly.keystore
      - name: Assemble release
        run: ./gradlew assembleRelease
          -PkeystoreFile=$RUNNER_TEMP/penly.keystore
          -PkeystorePassword=${{ secrets.PENLY_KEYSTORE_PASSWORD }}
          -PkeyAlias=${{ secrets.PENLY_KEY_ALIAS }}
          -PkeyPassword=${{ secrets.PENLY_KEY_PASSWORD }}
      - name: Signing validation
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          $ANDROID_HOME/build-tools/*/apksigner verify --print-certs "$APK"
      - name: Wipe keystore
        if: always()
        run: rm -f $RUNNER_TEMP/penly.keystore
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: true